plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naso.wxforward'
    compileSdk 29

    defaultConfig {
        applicationId 'com.naso.wxforward'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
