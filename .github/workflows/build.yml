name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SDK + licenses
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-29" "build-tools;30.0.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 7.5
        run: |
          curl -sLO "https://services.gradle.org/distributions/gradle-7.5-bin.zip"
          unzip -qo gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore release.jks -alias wxforward -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass naso123 -keypass naso123 \
            -dname "CN=Naso, OU=Dev, O=WxForward, L=NN, ST=GX, C=CN" 2>/dev/null
          $ANDROID_HOME/build-tools/30.0.3/apksigner sign --ks release.jks --ks-pass pass:naso123 \
            --key-pass pass:naso123 app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/wxforward-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wxforward-apk
          path: app/build/outputs/apk/release/wxforward-signed.apk
